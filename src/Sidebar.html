<!DOCTYPE html>
<html>
   
  <head>
    <base target="_top">

    <style>

      body{
        font-family: Arial, sans-serif;
        padding: 10px;
        font-size: 13px;
      }

      h3{
        margin-top: 0;
        color: #1f1f1f;
      }

      label{
        font-weight: bold;
        font-size: 12px;
      }

      input, select, textarea{
        width: 100%;
        padding: 6px;
        margin-top: 3px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
      }

      .btn{
        border: none;
        border-radius: 6px;
        padding: 9px 12px;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-primary{
        width: 100%;
        margin-top: 8px;
        background: #1967d2;
        color: white;
      }

      .btn-primary:hover{
        background: #1557b0;
      }

      .btn-secondary{
        width: 100%;
        margin-top: 8px;
        background: #e8f0fe;
        color: #1967d2;
      }

      .btn-light{
        background: #f1f3f4;
        color: #3c4043;
      }

      .btn-danger{
        background: #fce8e6;
        color: #c5221f;
      }

      .acoes-secundarias{
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .acoes-secundarias .btn{
        flex: 1;
      }

      #sugestoesMarca{
        margin-top: 4px;
        border-radius: 6px;
        overflow: hidden;
      }

      #sugestoesMarca div{
        padding: 8px;
        border: 1px solid #ddd;
        border-top: none;
        background: white;
        cursor: pointer;
      }

      #sugestoesMarca div:first-child{
        border-top: 1px solid #ddd;
      }

      #sugestoesMarca div:hover{
        background: #f1f3f4;
      }

      h4{
        margin: 18px 0 8px;
        padding-bottom: 5px;
        border-bottom: 1px solid #e0e0e0;
        font-size: 11px;
        text-transform: uppercase;
        color: #5f6368;
        letter-spacing: 0.6px;
      }

    </style>
  </head>
  <body>
    <h3>Gerador de UTM</h3>
      <p style="font-size:11px; color:#777;">
        Versão 1.0
      </p>

      <h4>Destino</h4>
      <p class="required note">* Campos obrigatórios</p>
    <label>Marca / Landing Page *</label><br>
      <input 
        type="text" 
        id="buscarMarca"
        placeholder="Comece a digitar..." 
        oninput="buscarMarca()"
        autocomplete="off"
      >
      
    <div id="sugestoesMarca"></div>

        <br><br>

    <label>URL</label><br>
      <input type="text" id="url" readonly><br><br>

    <label>Marca</label><br>
      <input type="hidden" id="marca"><br><br>

      <h4>Campanha</h4>

    <label>Data de publicação *</label><br>
      <input type="date" id="data"><br><br>
      
    <label>Campanha *</label><br>
      <input type="text" id="campanha"><br><br>
    
      <h4>Rastreamento</h4>

    <label>Modo de geração</label>

    <div class="modo-geracao">
      <label>
        Padrão
        <input
          type="radio"
          name="modo"
          value="meta"
          checked
          onchange="alteraModoGeracao()"
          >
          
      </label>

      <small>Facebook feed + Instagram Stories</small>

      <label>
        Personalizado
        <input
          type="radio"
          name="modo"
          value="personalizado"
          onchange="alteraModoGeracao()"
          >
          
      </label>
    </div>  

  <div id="camposPersonalizados">
    <label>Source *</label><br>
      <select id="source">
        <option value="">Selecione um source</option>
      </select><br><br>
      
    <label>Medium *</label><br>
      <select id="medium">
        <option value="">Selecione um medium</option>
      </select><br><br>

    <label>Content *</label><br>
      <select id="content">
        <option value="">Selecione um content</option>
      </select><br><br>
  </div>

      <h4>Link</h4>

<button
  id="btnGerar"
  class="btn btn-primary"
  type="button"
  onclick="gerarUTM()">
  Gerar link
</button>

<div
  id="mensagem"
  style="display:none; padding:8px; margin:10px 0; border-radius:6px; font-size:12px;">
</div>


<div id="resultadoPersonalizado">

  <label>Link gerado</label><br>

  <textarea
    id="resultado"
    rows="4"
    cols="30"
    readonly>
  </textarea>

  <br>

  <button
    class="btn btn-secondary"
    type="button"
    onclick="copiarUTM()">
    Copiar link
  </button>

</div>


<div id="resultadoMeta">

  <label>Link Facebook</label><br>

  <textarea
    id="resultadoFacebook"
    rows="4"
    cols="30"
    readonly>
  </textarea>

  <br>

  <button
    class="btn btn-secondary"
    type="button"
    onclick="copiarFacebook()">
    Copiar Facebook
  </button>

  <br><br>

  <label>Link Instagram</label><br>

  <textarea
    id="resultadoInstagram"
    rows="4"
    cols="30"
    readonly>
  </textarea>

  <br>

  <button
    class="btn btn-secondary"
    type="button"
    onclick="copiarInstagram()">
    Copiar Instagram
  </button>

</div> 
    
  <div class="acoes-secundarias">
    <button 
      class = "btn btn-light"
      type="button" 
      onclick="novoFormato()">
      Novo formato
    </button>

    <button 
      class = "btn btn-danger"
      type="button" 
      onclick="limparFormulario()">
      Limpar Formulário
    </button>
  </div>
  <br><br>

    

    <script>

      let mensagemTimer;

      function mostrarMensagem(texto, tipo){
        
        const mensagem = document.getElementById("mensagem");

        clearTimeout(mensagemTimer);

        mensagem.style.display = "block";
        mensagem.textContent = texto;

        if(tipo === "sucesso"){
          mensagem.style.backgroundColor = "#e6f4ea";
          mensagem.style.color = "#137333";
          mensagem.style.border = "1px solid #b7dfc3";
        }else if (tipo === "erro"){
          mensagem.style.backgroundColor = "#fce8e6";
          mensagem.style.color = "#c5221f";
          mensagem.style.border = "1px solid #f4b4ae";
        }else{
          mensagem.style.backgroundColor = "#e8f0fe";
          mensagem.style.color = "#1967d2";
          mensagem.style.border = "1px solid #aecbfa";
        }

        mensagemTimer = setTimeout(function(){
          mensagem.style.display = "none";
        }, 5000);
      }
      
      function copiarUTM(){

        const utm = document.getElementById("resultado").value;

        if (!utm){
          mostrarMensagem("Nenhum link foi gerado ainda.", "erro");
          return;
        }

        navigator.clipboard.writeText(utm)
          .then(function(){
            mostrarMensagem("Link copiado com sucesso!", "sucesso");
          })
          .catch(function (){
            mostrarMensagem("Não foi possível copiar o link.", "erro");
          });
      }

      function novoFormato(){

        document.getElementById("source").value = "";
        document.getElementById("medium").value = "";
        document.getElementById("content").value = "";
        document.getElementById("resultado").value = "";

      }

      function limparFormulario(){

        novoFormato();
        
        document.getElementById("data").value = "";
        document.getElementById("url").value = "";
        document.getElementById("marca").value = "";
        document.getElementById("campanha").value = "";
        document.getElementById("buscarMarca").value = "";
        document.getElementById("sugestoesMarca").innerHTML = "";
        document.getElementById("resultado").value = "";
        document.getElementById("resultadoFacebook").value = "";
        document.getElementById("resultadoInstagram").value = "";

        const botao = document.getElementById("btnGerar");
        
        botao.disabled = false;
        botao.textContent ="Gerar link";
        

      }

      document.addEventListener("DOMContentLoaded", function(){
        
        alteraModoGeracao();
        carregarSources();
        carregarMediums();
        carregarContents();

      });

      function carregarSources(){

        google.script.run
          .withSuccessHandler(function (sources){

            const select = document.getElementById("source");

            select.innerHTML = '<option value="">Selecione um source</option>';

            sources.forEach(function (source){

              const option = document.createElement("option");

              option.value = source;
              option.text = source;

              select.appendChild(option);

            });

          })
          .obterSources();
      }

      function carregarMediums(){

        google.script.run
         .withSuccessHandler(function (mediums){

          const select = document.getElementById("medium");

          select.innerHTML = '<option value="">Selecione um medium</option>';

          mediums.forEach(function (medium){

            const option = document.createElement("option");

            option.value = medium;
            option.text = medium;

            select.appendChild(option);
          });
         })
         .obterMediums();
      }

      function carregarContents(){

        google.script.run
         .withSuccessHandler(function (contents){

          const select = document.getElementById("content");

          select.innerHTML = '<option value="">Selecione um content</option>';

          contents.forEach(function (content){

            const option = document.createElement("option");

            option.value = content;
            option.text = content;

            select.appendChild(option);
          });
         })
         .obterContents();
      }

     function gerarUTM(){

      const botao = document.getElementById("btnGerar");

      botao.disabled = true;
      botao.textContent = "Gerando...";

       const url = document.getElementById("url").value;
       const marca = document.getElementById("marca").value;
       const data = document.getElementById("data").value;
       const campanha = document.getElementById("campanha").value;
       
       const modo = document.querySelector(
        'input[name="modo"]:checked'
       ).value;

       const dados = {
        url: url,
        marca: marca,
        data: data,
        campanha: campanha
       };

       if (modo === "meta"){

        google.script.run
          .withSuccessHandler(function(resultado){

            if (!resultado.sucesso){
              mostrarMensagem(resultado.mensagem, 
                "erro"
              );

              botao.disabled = false;
              botao.textContent = "Gerar link";

              return;
            }

            document.getElementById("resultadoFacebook").value =
              resultado.facebook;
            document.getElementById("resultadoInstagram").value = 
              resultado.instagram;

            mostrarMensagem(
              "2 Links gerados e salvos com sucesso!",
             "sucesso"
            );

            botao.disabled = false;
            botao.textContent = "Gerar link";
            
       })
       .withFailureHandler(function(erro){
          mostrarMensagem(
            "Erro ao gerar Links: " + erro.message,
            "erro"
          );

          botao.disabled = false;
          botao.textContent = "Gerar link";

       })
       .gerarPadraoMeta(dados);

       return;
      } 
       
       const source = document.getElementById("source").value;
       const medium = document.getElementById("medium").value;
       const content = document.getElementById("content").value;
       

       google.script.run
       .withSuccessHandler(function(resultado){

         document.getElementById("resultado").value = resultado;

         mostrarMensagem(
          "Link gerado e salvo com sucesso!", 
          "sucesso"
        );

        botao.disabled = false;
        botao.textContent = "Gerar link";

       })

       .withFailureHandler(function(erro){
         
         mostrarMensagem(
          "Erro ao gerar link: " + erro.message, 
          "erro"
        );

        botao.disabled = false;
        botao.textContent = "Gerar link";

       })
       .salvarLinhaUTMPeloFormulario({
         url: url,
         marca: marca,
         data: data,
         campanha: campanha,
         source: source,
         medium: medium,
         content: content
       });       
      }

      let buscaId = 0;

     function buscarMarca(){

       const termo = document.getElementById("buscarMarca").value;
       const sugestoes = document.getElementById("sugestoesMarca");

       buscaId++;
       const buscaAtual = buscaId;

       sugestoes.innerHTML = "";

       if (!termo.trim()){
         return;
        }

       google.script.run
        .withSuccessHandler(function (opcoes){
          
          if (buscaAtual !== buscaId){
            return;
          }

          sugestoes.innerHTML = "";

          if (opcoes.length === 0){
            sugestoes.innerHTML = "<div>Nenhuma opção encontrada</div>";
            return;
          }

          opcoes.forEach(function (item){

            const marca = item[0];
            const url = item[1];

            const opcao = document.createElement("div");

            opcao.textContent = marca;

            opcao.onclick = function (){
              selecionarMarca(marca,url);
            };

            sugestoes.appendChild(opcao);
          });
        })
        .withFailureHandler(function(erro){
          mostrarMensagem(
            "Erro ao buscar marcas: " + erro.message,
            "erro"
          );
        })
        .buscarOpcoesBase(termo);
      }

     function selecionarMarca(marca, url){
       document.getElementById("marca").value = marca;
       document.getElementById("url").value = url;
       document.getElementById("buscarMarca").value = marca;
       document.getElementById("sugestoesMarca").innerHTML = "";
       
      }

      function alteraModoGeracao(){
        const modo = document.querySelector(
          'input[name="modo"]:checked'
        ).value;

        const camposPersonalizados = document.getElementById(
          "camposPersonalizados"
        );

        const resultadoPersonalizado = document.getElementById(
          "resultadoPersonalizado"
        );

        const resultadoMeta = document.getElementById(
          "resultadoMeta"
        );

        if (modo === "meta"){
          camposPersonalizados.style.display = "none";
          resultadoPersonalizado.style.display = "none";
          resultadoMeta.style.display = "block";
        } else {
          camposPersonalizados.style.display = "block";
          resultadoPersonalizado.style.display = "block";
          resultadoMeta.style.display = "none";
        }
      }

      function copiarFacebook(){

        const link = document.getElementById("resultadoFacebook").value;

        if (!link){
          mostrarMensagem("Nenhum link do Facebook foi gerado.", "erro");
          return;
        }

        navigator.clipboard.writeText(link)
         .then(function(){
          mostrarMensagem("Link do Facebook copiado!", "sucesso");
         });
      }

      function copiarInstagram(){
        
        const link = document.getElementById("resultadoInstagram").value;

        if (!link){
          mostrarMensagem("Nenhum link do Instagram foi gerado", "erro");
          return;
        }

        navigator.clipboard.writeText(link)
          .then(function(){
            mostrarMensagem("Link do Instagram copiado!", "sucesso");
          });
      }
    </script>
  </body>
</html>
